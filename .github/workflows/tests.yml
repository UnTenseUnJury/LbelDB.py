# Runs the tests on every push and pull request, on Windows, macOS and Linux
# with every Python version LbelDB supports.  Author: UnTenseUnJury
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # show every failing combination, not just the first
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test tools
        run: python -m pip install . pytest tabulate

      - name: Run the tests
        run: python -m pytest -v

      - name: Run the tests without tabulate (the plain-table fallback)
        run: |
          python -m pip uninstall -y tabulate
          python -m pytest -v
